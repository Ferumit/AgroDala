<!doctype html>
<html lang="ru">
<head>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — AgroDala</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icons/sprout.svg">

  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-lite.js">

  <link rel="modulepreload" href="js/firebase.js">

</head>

    <div class="empty-state">
      <h1>Страница не найдена</h1>
      <a class="btn" href="index.html">Перейти в каталог</a>
