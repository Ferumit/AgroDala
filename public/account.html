<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — AgroDala</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icons/sprout.svg">
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/account.js"></script>
</head>
<body data-page="account">
  <main>
    <h1 data-greeting>Личный кабинет</h1>
    <p class="notice" data-staff hidden></p>
    <div class="two-columns" data-account hidden>
      <section class="panel">
        <h2>Мои заказы</h2>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Номер</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead>
            <tbody data-orders><tr><td colspan="4" class="muted">Загрузка…</td></tr></tbody>
          </table>
        </div>
      </section>
      <aside class="panel">
        <h2>Профиль</h2>
        <p class="form-message" data-message role="status" hidden></p>
        <form data-profile>
          <div class="field">
            <label for="name">Имя</label>
            <input id="name" name="name" autocomplete="name" maxlength="100" required>
          </div>
          <div class="field">
            <label for="phone">Телефон</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20"
                   placeholder="+7 700 000 00 00" pattern="[\d\s\(\)\+\-]{10,20}">
          </div>
          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" name="email" type="email" disabled>
          </div>
          <div class="field">
            <label for="city">Город</label>
            <input id="city" name="city" autocomplete="address-level2" maxlength="60">
          </div>
          <div class="field">
            <label for="street">Адрес доставки</label>
            <input id="street" name="street" autocomplete="street-address" maxlength="120"
                   placeholder="Улица, дом, квартира">
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Сохранить</button>
            <button class="btn btn--ghost" type="button" data-logout>Выйти</button>
          </div>
        </form>
      </aside>
    </div>
  </main>
</body>
</html>
